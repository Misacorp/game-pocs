<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Rigged Character Prototype</title>
<style>
  body { margin: 0; background: #16242b; color: #f1e6cf; font: 14px/1.4 system-ui, sans-serif; }
  .wrap { display: flex; gap: 28px; padding: 24px; align-items: flex-end; flex-wrap: wrap; }
  figure { margin: 0; display: grid; gap: 8px; justify-items: center; }
  canvas { background: linear-gradient(#f3a47a, #6f5a8e 70%, #3b3656); border-radius: 8px; image-rendering: auto; }
  figcaption { font-size: 12px; color: #b7aa90; text-align: center; max-width: 260px; }
</style>
</head>
<body>
<div class="wrap">
  <figure><canvas id="rig" width="520" height="360"></canvas><figcaption>Rigged vector paper-doll (prototype): parts drawn as shaded vector shapes, animated by a skeleton — idle, walk, attack loop.</figcaption></figure>
</div>
<script>
/*
 * Prototype: Maplestory-style layered paper-doll with a 2D skeleton.
 * Every part is a vector shape with cel shading + a darker outline; the rig drives angles per frame.
 * Equipment = swapping part drawers/colours (hat, coat, weapon) — no new sprite sheets needed.
 */
const cv = document.getElementById('rig'), g = cv.getContext('2d');
const P = { skin: '#f3c9a1', skinS: '#d99c78', hair: '#6b3b2a', hairH: '#8f5a3f', coat: '#3f7fa8', coatS: '#2c5d80', trim: '#e8c56a',
            pants: '#3a3350', boots: '#5a3a2a', steel: '#d7dde6', steelS: '#8b95a6', line: '#2a1a1e', eye: '#2d4a6b' };
const LW = 2.2;
function shape(path, fill, shade) {
  g.fillStyle = fill; path(); g.fill();
  if (shade) { g.save(); path(); g.clip(); g.fillStyle = shade; g.globalAlpha = .9; g.translate(6, 0); path(); g.fill(); g.restore(); }
  g.lineWidth = LW; g.strokeStyle = P.line; path(); g.stroke();
}
const rr = (x, y, w, h, r) => () => { g.beginPath(); g.roundRect(x, y, w, h, r); };
const el = (x, y, rx, ry) => () => { g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); };
function limb(x, y, ang, len, w, fill, shade, end) {
  g.save(); g.translate(x, y); g.rotate(ang);
  shape(rr(-w / 2, -2, w, len + 4, w / 2), fill, shade);
  if (end) end(len);
  g.restore();
}
function sword(len) {
  g.save(); g.translate(0, len); g.rotate(-1.3);
  shape(rr(-2, -4, 4, 10, 2), P.boots);                         // grip
  shape(rr(-8, 4, 16, 4, 2), P.trim);                            // guard
  g.beginPath(); g.moveTo(-3.5, 8); g.lineTo(3.5, 8); g.lineTo(2.5, 52); g.lineTo(0, 60); g.lineTo(-2.5, 52); g.closePath();
  g.fillStyle = P.steel; g.fill(); g.fillStyle = P.steelS; g.fillRect(0, 10, 2.5, 42); g.lineWidth = LW; g.strokeStyle = P.line; g.stroke();
  g.restore();
}
function character(cx, cy, t, mode, facing = 1) {
  const walk = mode === 'walk', atk = mode === 'attack';
  const ph = t * (walk ? 9 : 2.2);
  const bob = walk ? Math.abs(Math.sin(ph)) * 3 : Math.sin(ph) * 1.2;
  const legA = walk ? Math.sin(ph) * 0.6 : 0, armA = walk ? -Math.sin(ph) * 0.5 : Math.sin(ph) * 0.05;
  const swing = atk ? Math.sin(Math.min(1, (t * 2.4) % 1.4) * Math.PI) : 0;
  g.save(); g.translate(cx, cy); g.scale(facing, 1);
  // shadow
  g.fillStyle = 'rgba(0,0,0,.25)'; g.beginPath(); g.ellipse(0, 2, 26, 6, 0, 0, Math.PI * 2); g.fill();
  const hipY = -44 - bob;
  // back arm + back leg
  limb(-6, hipY - 34, 0.2 - armA - swing * 0.3, 22, 9, P.coatS, null);
  limb(-5, hipY, -legA, 24, 11, P.pants, null, (l) => shape(rr(-7, l - 2, 16, 8, 3), P.boots));
  // front leg
  limb(5, hipY, legA, 24, 11, P.pants, '#2c2640', (l) => shape(rr(-7, l - 2, 17, 8, 3), P.boots, '#43291c'));
  // torso / coat
  shape(() => { g.beginPath(); g.moveTo(-15, hipY - 36); g.lineTo(15, hipY - 36); g.lineTo(19, hipY + 6); g.lineTo(-19, hipY + 6); g.closePath(); }, P.coat, P.coatS);
  shape(rr(-19, hipY - 2, 38, 6, 2), P.trim);                    // belt
  // head (big chibi head)
  const hy = hipY - 60 + (atk ? swing * 2 : 0);
  shape(el(0, hy, 27, 25), P.skin, P.skinS);
  // hair back/top
  shape(() => { g.beginPath(); g.moveTo(-28, hy + 4); g.quadraticCurveTo(-30, hy - 30, 0, hy - 30); g.quadraticCurveTo(30, hy - 30, 28, hy + 2); g.quadraticCurveTo(18, hy - 16, 4, hy - 12); g.quadraticCurveTo(-8, hy - 20, -16, hy - 8); g.quadraticCurveTo(-22, hy - 4, -28, hy + 4); }, P.hair, P.hairH);
  // eyes (blink)
  const blink = (t % 3.6) > 3.45;
  for (const ex of [-9, 10]) {
    if (blink) { g.strokeStyle = P.line; g.lineWidth = 2.4; g.beginPath(); g.moveTo(ex - 5, hy + 4); g.lineTo(ex + 5, hy + 4); g.stroke(); continue; }
    shape(el(ex, hy + 3, 5, 7), '#fff'); g.fillStyle = P.eye; g.beginPath(); g.ellipse(ex + 1, hy + 4, 3.4, 5, 0, 0, 7); g.fill();
    g.fillStyle = '#fff'; g.beginPath(); g.arc(ex + 2.2, hy + 1.5, 1.4, 0, 7); g.fill();
  }
  g.fillStyle = 'rgba(255,120,120,.35)'; g.beginPath(); g.ellipse(-16, hy + 12, 5, 3, 0, 0, 7); g.ellipse(17, hy + 12, 5, 3, 0, 0, 7); g.fill();
  g.strokeStyle = P.line; g.lineWidth = 2; g.beginPath(); g.arc(1, hy + 13, 3.5, 0.2, Math.PI - 0.2); g.stroke();
  // front arm holding sword (attack swing drives the shoulder)
  limb(10, hipY - 34, -0.25 + armA + (atk ? -2.4 + swing * 3.2 : 0), 22, 9, P.coat, P.coatS, (l) => { shape(el(0, l, 5, 5), P.skin); sword(l); });
  g.restore();
}
function puffmoss(cx, cy, t) {
  const sq = Math.abs(Math.sin(t * 4)), hop = sq * 16;
  g.save(); g.translate(cx, cy);
  g.fillStyle = 'rgba(0,0,0,.25)'; g.beginPath(); g.ellipse(0, 2, 24 - hop * .4, 5, 0, 0, 7); g.fill();
  g.translate(0, -hop); g.scale(1 + (1 - sq) * .12, 1 - (1 - sq) * .1);
  shape(() => { g.beginPath(); g.moveTo(-26, 0); g.quadraticCurveTo(-28, -40, 0, -42); g.quadraticCurveTo(28, -40, 26, 0); g.closePath(); }, '#8fd46a', '#5fae4a');
  g.fillStyle = 'rgba(255,255,255,.55)'; g.beginPath(); g.ellipse(-10, -30, 7, 4, -0.5, 0, 7); g.fill();
  for (const ex of [-8, 8]) { g.fillStyle = P.line; g.beginPath(); g.ellipse(ex, -18, 3, 4.5, 0, 0, 7); g.fill(); g.fillStyle = '#fff'; g.beginPath(); g.arc(ex + 1, -20, 1.2, 0, 7); g.fill(); }
  g.fillStyle = 'rgba(255,110,120,.45)'; g.beginPath(); g.ellipse(-15, -11, 4, 2.5, 0, 0, 7); g.ellipse(15, -11, 4, 2.5, 0, 0, 7); g.fill();
  g.restore();
}
let t0 = performance.now();
function frame(now) {
  const t = (now - t0) / 1000;
  g.clearRect(0, 0, cv.width, cv.height);
  g.fillStyle = '#5f8f4a'; g.fillRect(0, 300, cv.width, 60); g.fillStyle = '#7fb85a'; g.fillRect(0, 300, cv.width, 8);
  character(110, 302, t, 'idle');
  character(260, 302, t, 'walk');
  character(400, 302, t, 'attack');
  puffmoss(470, 302, t);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__proto = true;
</script>
</body>
</html>
